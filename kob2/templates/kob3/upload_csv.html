<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="{% static 'manifest.json' %}">
    <title>رفع ملف الكوبونات</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f7f6; text-align: center; padding-top: 50px; }
        .box { background: white; padding: 30px; border-radius: 10px; display: inline-block; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); }
        input[type="file"] { margin: 20px 0; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        button { background: #28a745; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background: #218838; }
        .messages { margin-bottom: 15px; font-weight: bold; }
        .error { color: #d9534f; }
        .success { color: #28a745; }
    </style>
</head>
<body>

    <div class="box">
        <h2>رفع وتحديث الكوبونات (CSV) 📊</h2>
        
        <!-- عرض رسائل النجاح أو الأخطاء -->
        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <p class="{{ message.tags }}">{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <input type="file" name="csv_file" accept=".csv" required><br>
            <button type="submit">رفع الملف وتحديث البيانات</button>
        </form>
        
        <br><br>
        <a href="{% url 'k1' %}" style="color: #007bff; text-decoration: none;">← العودة للموقع الرئيسي</a>
    </div>

</body>
</html>
